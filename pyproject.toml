[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "getmyfamilytree"
version = "0.1.0"
description = "Traverse the connected FamilySearch tree and export GEDCOM with a resumable checkpoint"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    { name = "Aratea"}
]
keywords = ["familysearch", "genealogy", "gedcom", "family-tree"]
dependencies = ["getmyancestors==1.2.0", "keyring>=25,<26"]

[project.urls]
Repository = "https://github.com/Aratea10/GetMyFamilyTree"
Issues = "https://github.com/Aratea10/GetMyFamilyTree/issues"

[project.scripts]
getmyfamilytree = "getmyfamilytree.cli:main"

[tool.setuptools.packages.find]
include = ["getmyfamilytree*"]
