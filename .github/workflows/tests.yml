name: Tests
on:
  push:
    branches: [main, feat/research-planner]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Format
        run: python -m ruff format --check getmyfamilytree tests
      - name: Lint
        run: python -m ruff check getmyfamilytree tests benchmarks
      - name: Complexity
        run: python -m ruff check --select C901,PLR0912,PLR0913,PLR0915 getmyfamilytree
      - name: Compile
        run: python -m compileall -q getmyfamilytree tests
      - name: Test
        run: python -m unittest discover -s tests -v
